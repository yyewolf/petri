name: Release

# release-please keeps a release PR open on each branch with the changelog
# since the last release; merging it tags v0.<k8s minor>.<patch> and publishes
# the GitHub release. The controllerruntime sub-module follows: its go.mod can
# only require the new petri tag once that tag exists, so it gets its own
# commit and tag right after. See docs/releasing.md.

on:
  push:
    branches:
      - main
      - "release-*"

# The workflow token does everything, but GitHub starts no workflow for its
# pushes and PRs, so CI is dispatched explicitly: on the release PR's branch
# (its checks then show on the PR) and after the controllerruntime commit.
# Opening PRs needs "Allow GitHub Actions to create and approve pull requests".
permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          target-branch: ${{ github.ref_name }}

      - name: Run CI on the release PR
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.release.outputs.pr }}
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$(jq -r .headBranchName <<<"$PR")"

  controllerruntime:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.release-please.outputs.tag }}
      BRANCH: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      # While the repository is private the module proxy cannot see it; fetch
      # petri straight from git with the checkout's credentials instead.
      GOPRIVATE: ${{ github.event.repository.private && 'github.com/yyewolf/petri' || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check the tag matches KubernetesVersion
        run: .github/scripts/check-release-tag.sh "$TAG"

      - name: Keep older release lines from becoming the latest release
        if: github.ref_name != 'main'
        run: gh release edit "$TAG" --latest=false

      # GOWORK=off: this is what users get, without the workspace's local petri.
      - name: Require the new petri tag
        working-directory: controllerruntime
        env:
          GOWORK: "off"
        run: |
          go mod edit -require="github.com/yyewolf/petri@$TAG"
          go mod tidy
          go build ./...
          go vet ./...

      - name: Commit and tag controllerruntime
        run: |
          sub="controllerruntime/$TAG"
          git -c user.name=petri-release -c user.email=petri-release@users.noreply.github.com \
            commit -q -am "chore: release $sub"
          .github/scripts/check-release-tag.sh "$sub"
          git tag "$sub"
          git push --atomic origin "HEAD:refs/heads/$BRANCH" "refs/tags/$sub"
          gh workflow run ci.yml --ref "$BRANCH"

      - name: Publish the controllerruntime release
        run: |
          gh release create "controllerruntime/$TAG" --verify-tag --latest=false \
            --title "controllerruntime/$TAG" \
            --notes "The controllerruntime sub-module for petri [$TAG](${{ github.server_url }}/${{ github.repository }}/releases/tag/$TAG), which lists the changes."

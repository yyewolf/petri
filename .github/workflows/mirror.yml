name: Mirror

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirror
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - id: plan
        name: Plan updates
        run: |
          matrix=$(go run ./hack/mirror plan)
          echo "$matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "count=$(jq '.include | length' <<<"$matrix")" >> "$GITHUB_OUTPUT"

  update:
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      BRANCH: ${{ matrix.branch }}
      VERSION: ${{ matrix.version }}
      KIND: ${{ matrix.kind }}
      KINE: ${{ matrix.kine }}
    steps:
      - name: Require MIRROR_TOKEN
        env:
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          if [[ -z "$MIRROR_TOKEN" ]]; then
            echo "::error::Set the MIRROR_TOKEN secret: a fine-grained personal access token for this repository with Contents and Pull requests read/write. PRs opened with GITHUB_TOKEN do not trigger CI."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.branch }}
          fetch-depth: 0
          # Tests below run third-party module code; keep the token off disk and
          # hand it only to the steps that push.
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Cut the release branch for the outgoing minor
        if: matrix.kind == 'minor'
        env:
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          remote="https://x-access-token:${MIRROR_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          minor=$(sed -n 's/^const KubernetesVersion = "\(.*\)"$/\1/p' version.go)
          release="release-$minor"
          if git ls-remote --exit-code --heads "$remote" "$release" >/dev/null; then
            echo "$release already exists"
          else
            git push "$remote" "HEAD:refs/heads/$release"
          fi

      # Failures here still open a (draft) PR: a broken update, such as a new
      # minor that needs a kine or Go bump, is exactly what needs a human.
      # An empty KINE keeps the kine version internal/kine/MIRROR.json records.
      - name: Regenerate the mirror
        id: mirror
        continue-on-error: true
        run: make mirror K8S_VERSION="$VERSION" KINE_VERSION="$KINE"

      - name: Bump the controllerruntime sub-module
        id: submodule
        if: matrix.kind == 'minor' && steps.mirror.outcome == 'success'
        continue-on-error: true
        run: |
          if .github/scripts/bump-submodule.sh "$VERSION"; then
            echo "outcome=success" >>"$GITHUB_OUTPUT"
          elif [[ $? == 2 ]]; then
            echo "outcome=none" >>"$GITHUB_OUTPUT"
          else
            echo "outcome=failed" >>"$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Test
        id: test
        if: steps.mirror.outcome == 'success'
        continue-on-error: true
        run: |
          go test -race -timeout 20m ./...
          (cd controllerruntime && go test -race -timeout 20m ./...)

      - name: Open or update the pull request
        env:
          GH_TOKEN: ${{ secrets.MIRROR_TOKEN }}
          REMOTE: https://x-access-token:${{ secrets.MIRROR_TOKEN }}@github.com/${{ github.repository }}.git
          MIRROR_OUTCOME: ${{ steps.mirror.outcome }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
          SUBMODULE_OUTCOME: ${{ steps.submodule.outputs.outcome || (matrix.kind == 'minor' && 'skipped' || '') }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: .github/scripts/mirror-pr.sh

      - name: Fail the run when the update is broken
        if: steps.mirror.outcome != 'success' || steps.test.outcome != 'success'
        run: |
          echo "::error::Mirror update to $VERSION opened as a draft PR: make mirror=${{ steps.mirror.outcome }}, tests=${{ steps.test.outcome }}."
          exit 1

name: Mirror

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirror
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - id: plan
        name: Plan updates
        run: |
          matrix=$(go run ./hack/mirror plan)
          echo "$matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "count=$(jq '.include | length' <<<"$matrix")" >> "$GITHUB_OUTPUT"

  update:
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    # The workflow token pushes mirror/<branch> and release-1.N, opens the PR,
    # and dispatches CI on it: GitHub starts no workflow for its pushes or PRs.
    # This needs "Allow GitHub Actions to create and approve pull requests".
    permissions:
      contents: write
      pull-requests: write
      actions: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      BRANCH: ${{ matrix.branch }}
      VERSION: ${{ matrix.version }}
      KIND: ${{ matrix.kind }}
      KINE: ${{ matrix.kine }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.branch }}
          fetch-depth: 0
          # Tests below run third-party module code; keep the token off disk and
          # hand it only to the steps that push.
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Cut the release branch for the outgoing minor
        if: matrix.kind == 'minor'
        env:
          TOKEN: ${{ github.token }}
        run: |
          remote="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          minor=$(sed -n 's/^const KubernetesVersion = "\(.*\)"$/\1/p' version.go)
          release="release-$minor"
          if git ls-remote --exit-code --heads "$remote" "$release" >/dev/null; then
            echo "$release already exists"
          else
            git push "$remote" "HEAD:refs/heads/$release"
          fi

      - uses: actions/setup-node@v7
        if: matrix.kind == 'minor'
        with:
          node-version-file: website/.nvmrc
          cache: npm
          cache-dependency-path: website/package-lock.json

      # The PR that moves main to the next minor also freezes the outgoing
      # line's docs; version.go still names that line until make mirror runs.
      - name: Freeze the outgoing line's docs
        id: docs
        if: matrix.kind == 'minor'
        continue-on-error: true
        working-directory: website
        run: |
          npm ci
          scripts/version-docs.sh "0.$(sed -n 's/^const KubernetesVersion = "1\.\(.*\)"$/\1/p' ../version.go)"

      # Failures here still open a (draft) PR: a broken update, such as a new
      # minor that needs a kine or Go bump, is exactly what needs a human.
      # An empty KINE keeps the kine version internal/kine/MIRROR.json records.
      - name: Regenerate the mirror
        id: mirror
        continue-on-error: true
        run: make mirror K8S_VERSION="$VERSION" KINE_VERSION="$KINE"

      - name: Bump the controllerruntime sub-module
        id: submodule
        if: matrix.kind == 'minor' && steps.mirror.outcome == 'success'
        continue-on-error: true
        run: |
          if .github/scripts/bump-submodule.sh "$VERSION"; then
            echo "outcome=success" >>"$GITHUB_OUTPUT"
          elif [[ $? == 2 ]]; then
            echo "outcome=none" >>"$GITHUB_OUTPUT"
          else
            echo "outcome=failed" >>"$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Test
        id: test
        if: steps.mirror.outcome == 'success'
        continue-on-error: true
        run: |
          go test -race -timeout 20m ./...
          (cd controllerruntime && go test -race -timeout 20m ./...)

      - name: Open or update the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REMOTE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
          MIRROR_OUTCOME: ${{ steps.mirror.outcome }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
          SUBMODULE_OUTCOME: ${{ steps.submodule.outputs.outcome || (matrix.kind == 'minor' && 'skipped' || '') }}
          DOCS_OUTCOME: ${{ steps.docs.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: .github/scripts/mirror-pr.sh

      - name: Fail the run when the update is broken
        if: steps.mirror.outcome != 'success' || steps.test.outcome != 'success' || steps.docs.outcome == 'failure'
        run: |
          echo "::error::Mirror update to $VERSION opened as a draft PR: make mirror=${{ steps.mirror.outcome }}, tests=${{ steps.test.outcome }}, docs freeze=${{ steps.docs.outcome }}."
          exit 1

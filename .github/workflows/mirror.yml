name: Mirror

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirror
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - id: plan
        name: Plan updates
        run: |
          matrix=$(go run ./hack/mirror plan)
          echo "$matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "count=$(jq '.include | length' <<<"$matrix")" >> "$GITHUB_OUTPUT"

  update:
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      BRANCH: ${{ matrix.branch }}
      VERSION: ${{ matrix.version }}
      KIND: ${{ matrix.kind }}
    steps:
      - name: Require MIRROR_TOKEN
        env:
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          if [[ -z "$MIRROR_TOKEN" ]]; then
            echo "::error::Set the MIRROR_TOKEN secret: a fine-grained personal access token for this repository with Contents and Pull requests read/write. PRs opened with GITHUB_TOKEN do not trigger CI."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.branch }}
          fetch-depth: 0
          # Tests below run third-party module code; keep the token off disk and
          # hand it only to the steps that push.
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Cut the release branch for the outgoing minor
        if: matrix.kind == 'minor'
        env:
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          remote="https://x-access-token:${MIRROR_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          minor=$(sed -n 's/^const KubernetesVersion = "\(.*\)"$/\1/p' version.go)
          release="release-$minor"
          if git ls-remote --exit-code --heads "$remote" "$release" >/dev/null; then
            echo "$release already exists"
          else
            git push "$remote" "HEAD:refs/heads/$release"
          fi

      # Failures here still open a (draft) PR: a broken update, such as a new
      # minor that needs a kine or Go bump, is exactly what needs a human.
      - name: Regenerate the mirror
        id: mirror
        continue-on-error: true
        run: make mirror K8S_VERSION="$VERSION"

      - name: Test
        id: test
        if: steps.mirror.outcome == 'success'
        continue-on-error: true
        run: go test -race ./...

      - name: Open or update the pull request
        env:
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
          GH_TOKEN: ${{ secrets.MIRROR_TOKEN }}
          MIRROR_OUTCOME: ${{ steps.mirror.outcome }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "::error::make mirror K8S_VERSION=$VERSION changed nothing; see the 'Regenerate the mirror' step."
            exit 1
          fi

          head="mirror/$VERSION"
          remote="https://x-access-token:${MIRROR_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config user.name "petri-mirror"
          git config user.email "petri-mirror@users.noreply.github.com"
          git switch -c "$head"
          git add -A
          git commit -m "build: mirror Kubernetes $VERSION"
          git push --force "$remote" "$head"

          body="Regenerated with \`make mirror K8S_VERSION=$VERSION\` by the Mirror workflow."
          if [[ "$KIND" == minor ]]; then
            body="$body

          This moves \`$BRANCH\` to a new Kubernetes minor. The previous minor continues on its \`release-1.N\` branch. Check whether the Go version or kine also need a bump."
          fi

          draft=()
          if [[ "$MIRROR_OUTCOME" != success || "$TEST_OUTCOME" != success ]]; then
            draft=(--draft)
            body="$body

          **Needs a human:** \`make mirror\` finished with \`$MIRROR_OUTCOME\` and \`go test -race ./...\` with \`${TEST_OUTCOME:-skipped}\` in [this run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
          fi

          state=$(gh pr view "$head" --json state --jq .state 2>/dev/null || true)
          if [[ "$state" == OPEN ]]; then
            echo "PR for $head is already open; branch updated."
          else
            gh pr create --base "$BRANCH" --head "$head" --title "build: mirror Kubernetes $VERSION" --body "$body" "${draft[@]}"
          fi

      - name: Fail the run when the update is broken
        if: steps.mirror.outcome != 'success' || steps.test.outcome != 'success'
        run: |
          echo "::error::Mirror update to $VERSION opened as a draft PR: make mirror=${{ steps.mirror.outcome }}, tests=${{ steps.test.outcome }}."
          exit 1

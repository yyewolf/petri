name: Feature request
description: Suggest something petri should do.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to test, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: textarea
    id: envtest
    attributes:
      label: How envtest handles this
      description: If envtest supports this today, describe how. Otherwise leave it empty.

name: CI

on:
  pull_request:
  # Bot PRs (release, mirror) come from the workflow token, which starts no
  # workflow; their workflows dispatch CI on the PR branch instead.
  workflow_dispatch:
  push:
    branches:
      - main
      - "release-1.*"

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Go tests
        run: |
          go test -race -timeout 20m ./...
          (cd controllerruntime && go test -race -timeout 20m ./...)
          (cd website/examples && go test -race -timeout 20m ./...)

      - name: Script tests
        if: runner.os == 'Linux'
        run: |
          .github/scripts/check-release-tag_test.sh
          .github/scripts/bump-submodule_test.sh
          .github/scripts/mirror-pr_test.sh
          website/scripts/version-docs_test.sh
          .github/scripts/check-readme-sample_test.sh
          .github/scripts/check-readme-sample.sh

  # A release PR must stay on the release line version.go declares: after a
  # Kubernetes minor move, the next release is v0.<new minor>.0, not a patch.
  release-pr:
    if: startsWith(github.head_ref || github.ref_name, 'release-please--')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check the release version matches KubernetesVersion
        run: .github/scripts/check-release-tag.sh "v$(jq -r '.["."]' .release-please-manifest.json)"

  # The documentation site; broken links and missing samples fail the build.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: website/.nvmrc
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Build the site
        working-directory: website
        run: |
          npm ci
          npm run build

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14
          working-directory: controllerruntime

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14
          working-directory: website/examples

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Every platform the mirror's file set is computed for, plus this one.
      # No platform reuses another's build cache, and all six together fill
      # the runner's disk, so the cache is cleared after each.
      - name: Cross-build
        run: |
          for platform in linux/amd64 darwin/amd64 darwin/arm64 linux/arm64 windows/amd64 windows/arm64; do
            echo "$platform"
            GOOS=${platform%/*} GOARCH=${platform#*/} go build ./...
            (cd controllerruntime && GOOS=${platform%/*} GOARCH=${platform#*/} go build ./...)
            go clean -cache
          done

  mirror-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Regenerate the mirror
        run: make mirror

      - name: Fail on drift
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git status --porcelain
            git diff --stat
            echo "::error::internal/kubernetes, internal/kine or go.mod differs from 'make mirror' output. Never edit the mirror by hand; run 'make mirror' and commit the result."
            exit 1
          fi

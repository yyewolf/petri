version: 2
updates:
  # Go modules are pinned by `make mirror` to the versions upstream Kubernetes
  # uses, and updated by the mirror workflow, so Dependabot only handles actions.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Conventional commit type for release-please: action bumps never release.
    commit-message:
      prefix: ci

  # The documentation site's npm packages, in one weekly PR. Typed ci so the
  # site's dependencies never cut a petri release.
  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: weekly
    groups:
      website:
        patterns: ["*"]
    commit-message:
      prefix: ci
